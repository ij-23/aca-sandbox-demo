[tool.pytest.ini_options]
testpaths = ["backend/tests", "scripts/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI Depends is deliberately evaluated in route signatures.
