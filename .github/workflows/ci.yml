name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check backend scripts workflows/shared
      - run: ruff format --check backend scripts workflows/shared
      # Only platform tests; never discover or execute demo-repo code on a runner.
      - run: python -m pytest backend/tests scripts/tests -q
      - run: python scripts/export_schemas.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: find workflows -name '*.mjs' -exec node --check {} \;
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - name: Build application image only (no push, no Azure calls)
        run: docker build -t aca-sandbox-demo:ci .
      - name: Verify isolated application container and remove it
        run: python scripts/verify_container.py --image aca-sandbox-demo:ci
