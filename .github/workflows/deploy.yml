name: Build release for local-state deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-application-release
  cancel-in-progress: false
# Local Terraform state remains exclusively on the customer's deployment machine.
# This job publishes an app image and a non-secret digest manifest, never tfstate/plans.
jobs:
  build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACR_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public build configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID"
          test -n "$ACR_SERVER" && test -n "$ACR_NAME"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      # AcrPush is the only granted role. Registry name lookup may warn without Reader;
      # azure/login + registry token exchange still authorizes the known registry.
      - run: az acr login --name "$ACR_NAME"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/academo-app:${{ github.sha }}
      - name: Write immutable release manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          image = os.environ['ACR_SERVER'] + '/academo-app@' + os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'[a-z0-9.]+/academo-app@sha256:[a-f0-9]{64}', image)
          pathlib.Path('release.json').write_text(json.dumps({'image':image,'source_sha':os.environ['SOURCE_SHA']})+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('Image published: `' + image + '`\n\nDeploy using the existing local Terraform state and the documented inspected-plan procedure. This job does not update the Container App.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: application-release
          path: release.json
          retention-days: 7
